project:
  type: website
  output-dir: _site
  pre-render: python3 scripts/render_content.py
  resources:
    - assets/pdf/**
    - assets/images/**
    - assets/figures/**

website:
  title: "Aref Einizade"
  site-url: "https://arefeinizade.github.io"
  description: "Aref Einizade — graph machine learning, graph signal processing, higher-order learning, generative models, and biomedical applications."
  favicon: assets/images/aref-favicon.svg
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    background: light
    logo-alt: "Aref Einizade"
    left:
      - href: index.qmd
        text: Home
      - href: research/index.qmd
        text: Research
      - href: people/index.qmd
        text: Team
      - href: publications/index.qmd
        text: Publications
      - href: teaching/index.qmd
        text: Teaching
      - href: news/index.qmd
        text: News
    right:
      - href: cv/index.qmd
        text: CV
      - icon: envelope
        href: mailto:aref.einizade@telecom-sudparis.eu
        aria-label: Email Aref Einizade
      - icon: mortarboard-fill
        href: https://scholar.google.com/scholar?q=%22Aref+Einizade%22
        aria-label: Google Scholar
      - icon: github
        href: https://github.com/ArefEinizade2
        aria-label: GitHub
      - icon: linkedin
        href: https://fr.linkedin.com/in/aref-einizade-4793b785
        aria-label: LinkedIn
  page-footer:
    left: "© 2026 Aref Einizade"
    center: "Télécom SudParis · Institut Polytechnique de Paris"
    right:
      - text: ORCID
        href: https://orcid.org/0000-0002-8546-7261
      - text: Email
        href: mailto:aref.einizade@telecom-sudparis.eu

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    smooth-scroll: true
    anchor-sections: true
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    include-in-header: _includes/person-schema.html
    include-after-body: _includes/site-scripts.html

execute:
  freeze: auto

lang: en
